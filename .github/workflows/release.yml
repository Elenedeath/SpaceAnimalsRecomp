# Releases of this fork.
#
#   Windows: run this workflow by hand (Actions > Release > Run workflow, platform "windows"), or push a tag
#            "v<version>" (for example v1.1.0.1). Built from the "shaders" branch.
#   Linux:   run this workflow by hand with platform "linux": the AppImage is built from the "linux" branch with
#            the "shaders" branch merged in, and published under the tag "linux-v<version>" (not marked as the
#            latest release, so the Windows launcher's update check keeps finding the Windows release).
#   All:     platform "all" (the default by hand): both builds run side by side and one release "v<version>",
#            marked as the latest, gets the Windows zips, the AppImage and a common SHA256SUMS.txt. The Windows
#            launcher's update check only looks for the "-update.zip" asset, so the AppImage next to it is harmless.
#
# Branches: the first one is checked out, the others are merged into it for the build only (nothing is pushed).
# The release tag points at the head of the first branch; the notes list the commit of every branch.
#
# The launcher background videos are not in git (.gitignore): they are taken from this repository's "extraits"
# release (assets extrait_*.mp4).
#
# Changed in the build only, never committed:
#   recomp/VERSION                  set to the released version (the launcher compares it with the latest release)
#   recomp/launcher/maj.py DEPOT    this repository, so the launcher updates from this fork's releases

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "all (one release: Windows zips and Linux AppImage), windows (zip) or linux (AppImage)"
        type: choice
        options: [all, windows, linux]
        default: all
      version:
        description: "Version number without the v, for example 1.1.0.1"
        required: true
      branches:
        description: "Branches to build, the others merged into the first (empty: 'shaders' for windows, 'linux shaders' for linux)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  EXTRAITS_TAG: extraits
  PYTHONUTF8: "1"

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      target: ${{ steps.m.outputs.target }}
      notes: ${{ steps.m.outputs.notes }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Version and tag
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BRANCHES: ${{ inputs.branches }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"; version="${tag#v}"
          else
            version="$IN_VERSION"; tag="v$version"
          fi
          branches="${IN_BRANCHES:-shaders}"; ref="${branches%% *}"
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "::error::bad version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.ref }}
          fetch-depth: 0

      - name: Merge the other branches (build only)
        id: m
        run: |
          git config user.name "release workflow"
          git config user.email "release-workflow@users.noreply.github.com"
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          notes="$(echo ${{ steps.v.outputs.branches }} | cut -d' ' -f1) $(git rev-parse --short HEAD)"
          for b in $(echo ${{ steps.v.outputs.branches }} | cut -s -d' ' -f2-); do
            git merge --no-edit "origin/$b" || { echo "::error::$b does not merge cleanly"; exit 1; }
            notes="$notes, $b $(git rev-parse --short origin/$b)"
          done
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Launcher background videos
        run: |
          gh release download "$EXTRAITS_TAG" -R "$GITHUB_REPOSITORY" --pattern 'extrait_*.mp4' --dir recomp/launcher/extraits
          ls -l recomp/launcher/extraits

      - name: Version and update source (build only)
        run: |
          printf '%s' "${{ steps.v.outputs.version }}" > recomp/VERSION
          sed -i "s|^DEPOT = \".*\"|DEPOT = \"$GITHUB_REPOSITORY\"|" recomp/launcher/maj.py
          grep -q "^DEPOT = \"$GITHUB_REPOSITORY\"$" recomp/launcher/maj.py || { echo "::error::DEPOT not replaced in maj.py"; exit 1; }

      - name: Build tools cache
        uses: actions/cache@v4
        with:
          path: recomp/outils/_archives
          key: outils-windows-${{ hashFiles('recomp/launcher/outils.py') }}

      - name: Build tools (outils.py)
        run: python recomp/launcher/outils.py --garder-archives

      - name: Launcher (construire.py)
        run: python recomp/launcher/construire.py

      - name: Package (paquet.py)
        run: python recomp/launcher/paquet.py dist --version "${{ steps.v.outputs.version }}"

      - name: Keep the packages for the common release
        if: inputs.platform == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1

      - name: Publish the release
        if: inputs.platform != 'all'
        run: |
          ls -l dist
          gh release create "${{ steps.v.outputs.tag }}" dist/*.zip dist/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" \
            --target "${{ steps.m.outputs.target }}" --latest \
            --title "SpaceAnimalsRecomp ${{ steps.v.outputs.version }}" \
            --notes "Windows build. Branches: ${{ steps.m.outputs.notes }}."

  linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'linux' || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    steps:
      - name: Version and tag
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BRANCHES: ${{ inputs.branches }}
        run: |
          version="$IN_VERSION"; tag="linux-v$version"
          branches="${IN_BRANCHES:-linux shaders}"; ref="${branches%% *}"
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "::error::bad version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.ref }}
          fetch-depth: 0

      - name: Merge the other branches (build only)
        id: m
        run: |
          git config user.name "release workflow"
          git config user.email "release-workflow@users.noreply.github.com"
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          notes="$(echo ${{ steps.v.outputs.branches }} | cut -d' ' -f1) $(git rev-parse --short HEAD)"
          for b in $(echo ${{ steps.v.outputs.branches }} | cut -s -d' ' -f2-); do
            git merge --no-edit "origin/$b" || { echo "::error::$b does not merge cleanly"; exit 1; }
            notes="$notes, $b $(git rev-parse --short origin/$b)"
          done
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      # The Ubuntu mirrors of the runners can be very slow (apt took 10 to 20 minutes, ffmpeg alone pulls dozens of
      # libraries): clang, lld, cmake, ninja, pkg-config and readelf come from the runner image, apt only installs
      # what is missing, and ffmpeg is a static build from GitHub, kept in the cache.
      - name: Build tools (runner image)
        run: |
          mkdir -p "$HOME/bin" && echo "$HOME/bin" >> "$GITHUB_PATH" && export PATH="$HOME/bin:$PATH"
          # clang-18, ld.lld-18… without the plain name: link the newest version
          for t in clang clang++ ld.lld; do
            command -v "$t" >/dev/null && continue
            v=$(ls /usr/bin/"$t"-[0-9]* 2>/dev/null | sort -V | tail -1)
            [ -n "$v" ] && ln -sf "$v" "$HOME/bin/$t"
          done
          manque=""
          for t in clang:clang clang++:clang ld.lld:lld cmake:cmake ninja:ninja-build pkg-config:pkg-config readelf:binutils; do
            command -v "${t%%:*}" >/dev/null || manque="$manque ${t#*:}"
          done
          if [ -n "$manque" ]; then
            echo "::warning::not on the runner image, installed with apt:$manque"
            for i in 1 2 3; do timeout 180 sudo apt-get update && break; done
            timeout 900 sudo apt-get install -y --no-install-recommends $manque
          fi
          clang --version | head -1; ld.lld --version; cmake --version | head -1; ninja --version

      - name: ffmpeg cache
        id: ffc
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-lgpl-1

      - name: ffmpeg (static build, BtbN/FFmpeg-Builds)
        run: |
          if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz \
              | tar -xJ -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg'
          fi
          "$HOME/ffmpeg/ffmpeg" -hide_banner -version | head -1
          echo "FFMPEG=$HOME/ffmpeg/ffmpeg" >> "$GITHUB_ENV"

      - name: Launcher background videos
        run: |
          gh release download "$EXTRAITS_TAG" -R "$GITHUB_REPOSITORY" --pattern 'extrait_*.mp4' --dir "$HOME/extraits"
          ls -l "$HOME/extraits"

      - name: Version (build only)
        run: printf '%s' "${{ steps.v.outputs.version }}" > recomp/VERSION

      - name: System root cache
        uses: actions/cache@v4
        with:
          path: |
            ~/sysroot
            ~/sysroot.cache
          key: sysroot-${{ hashFiles('recomp/launcher/sysroot_linux.py') }}

      - name: System root (sysroot_linux.py)
        run: python3 recomp/launcher/sysroot_linux.py "$HOME/sysroot" --cache "$HOME/sysroot.cache"

      - name: AppImage (paquet_linux.py)
        run: |
          python3 recomp/launcher/paquet_linux.py dist --sysroot "$HOME/sysroot" --extraits "$HOME/extraits" \
            --version "${{ steps.v.outputs.version }}"
          cd dist && sha256sum *.AppImage > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Keep the package for the common release
        if: inputs.platform == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 1

      - name: Publish the release
        if: inputs.platform != 'all'
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/*.AppImage dist/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" \
            --target "${{ steps.m.outputs.target }}" --latest=false \
            --title "SpaceAnimalsRecomp ${{ steps.v.outputs.version }} (Linux)" \
            --notes "Linux AppImage (Steam Deck and desktop Linux). Branches: ${{ steps.m.outputs.notes }}."

  # platform "all": one release with both packages (tag v<version>, latest)
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets

      - name: Publish the release
        run: |
          ls -lR paquets
          mkdir dist
          mv paquets/windows/*.zip paquets/linux/*.AppImage dist/
          cat paquets/windows/SHA256SUMS.txt paquets/linux/SHA256SUMS.txt | tr -d '\r' > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          gh release create "${{ needs.windows.outputs.tag }}" dist/* -R "$GITHUB_REPOSITORY" \
            --target "${{ needs.windows.outputs.target }}" --latest \
            --title "SpaceAnimalsRecomp ${{ needs.windows.outputs.version }}" \
            --notes "Windows (zip, update zip) and Linux (AppImage: Steam Deck and desktop Linux). Branches: ${{ needs.windows.outputs.notes }}."
